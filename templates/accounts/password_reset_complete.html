{% extends 'base.html' %}
{% load static %}
{% block title %}Password reset complete – Trendy Threads{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/account.css' %}">{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width: 420px; margin: 0 auto; padding: 2rem 0;">
  <div class="auth-card" style="background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 1.5rem;">
    <h1 class="page-title mb-3">Password reset complete</h1>
    <p class="text-muted">You can now sign in with your new password.</p>
    <p class="mb-0"><a href="{% url 'accounts:auth_page' %}" class="btn" style="display: inline-block; padding: 0.6rem 1.25rem; font-weight: 600; background: var(--text); color: var(--surface); border: none; border-radius: var(--radius); text-decoration: none;">Sign in</a></p>
  </div>
</div>
{% endblock %}
