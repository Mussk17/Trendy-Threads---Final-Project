{% extends 'base.html' %}
{% load static %}
{% block title %}Reset email sent – Trendy Threads{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/account.css' %}">{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width: 420px; margin: 0 auto; padding: 2rem 0;">
  <div class="auth-card" style="background: var(--surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 1.5rem;">
    <h1 class="page-title mb-3">Check your email</h1>
    <p class="text-muted">If an account exists for that address, we’ve sent a link to reset your password.</p>
    <p class="mb-0"><a href="{% url 'accounts:auth_page' %}" style="color: var(--text); font-weight: 500;">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
