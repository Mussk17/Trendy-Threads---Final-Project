<div id="chatbot-widget" data-user-display="{% if user.is_authenticated %}{{ user.get_full_name|default:user.username }}{% endif %}">
  <button type="button" id="chatbot-toggle" aria-label="Open support">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chatbot-btn-icon"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Support</span>
  </button>
  <div id="chatbot-panel" class="chatbot-panel" hidden>
    <div class="chatbot-header">
      <h3>Support</h3>
      <p class="chatbot-subtitle">Ask about policies, refunds, shipping, returns & FAQs — powered by our support knowledge base</p>
      <button type="button" id="chatbot-close" aria-label="Close chat">&times;</button>
    </div>
    <div id="chatbot-messages" class="chatbot-messages"></div>
    <div class="chatbot-input-wrap">
      <textarea id="chatbot-input" rows="1" placeholder="Type your question..." autocomplete="off"></textarea>
      <button type="button" id="chatbot-send">Send</button>
    </div>
  </div>
</div>

<style>
#chatbot-widget {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  font-family: 'Outfit', sans-serif;
}
#chatbot-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  background: var(--text);
  color: white;
  border: none;
  border-radius: 28px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
}
#chatbot-toggle svg { stroke: currentColor; color: inherit; }
#chatbot-toggle:hover { background: var(--accent-hover); }
.chatbot-panel {
  position: absolute;
  bottom: 60px;
  right: 0;
  width: 400px;
  max-width: calc(100vw - 48px);
  height: 520px;
  background: var(--surface);
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  border: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chatbot-panel[hidden] { display: none !important; }
.chatbot-header {
  padding: 16px 20px;
  background: var(--text);
  color: white;
  position: relative;
  flex-shrink: 0;
}
.chatbot-header h3 { margin: 0; font-size: 1.1rem; }
.chatbot-subtitle { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
#chatbot-close {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  color: white;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}
.chatbot-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-height: 0;
}
.chatbot-msg-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  max-width: 100%;
}
.chatbot-msg-row.user-row {
  flex-direction: row-reverse;
}
.chatbot-avatar {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 600;
  color: #fff;
  background: var(--text);
}
.chatbot-msg-row.bot-row .chatbot-avatar {
  background: #4b5563;
  color: #fff;
}
.chatbot-msg-row.bot-row .chatbot-avatar svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
}
.chatbot-bubble {
  max-width: calc(100% - 50px);
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 0.95rem;
  line-height: 1.5;
  word-wrap: break-word;
}
.chatbot-msg-row.user-row .chatbot-bubble {
  background: var(--text);
  color: white;
  border-bottom-right-radius: 4px;
}
.chatbot-msg-row.bot-row .chatbot-bubble {
  background: #e8e6e3;
  color: #1a1a1a;
  border-bottom-left-radius: 4px;
}
.chatbot-bubble .chatbot-sources {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(0,0,0,0.08);
  font-size: 0.8rem;
  color: #555;
}
.chatbot-bubble .chatbot-sources span {
  display: block;
  margin-top: 4px;
}
.chatbot-input-wrap {
  padding: 16px;
  border-top: 1px solid #e8e6e3;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex-shrink: 0;
  background: #fff;
}
#chatbot-input {
  flex: 1;
  min-height: 44px;
  max-height: 120px;
  padding: 12px 14px;
  border: 1px solid #e8e6e3;
  border-radius: 10px;
  font-size: 0.95rem;
  font-family: inherit;
  line-height: 1.5;
  resize: none;
  overflow-y: auto;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
#chatbot-input:focus {
  outline: none;
  border-color: var(--text);
  box-shadow: 0 0 0 2px rgba(26, 26, 26, 0.08);
}
#chatbot-input::placeholder {
  color: #9ca3af;
}
#chatbot-send {
  flex-shrink: 0;
  padding: 12px 18px;
  background: var(--text);
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 500;
  cursor: pointer;
  align-self: flex-end;
}
#chatbot-send:hover { background: var(--accent-hover); }
#chatbot-send:disabled { opacity: 0.6; cursor: not-allowed; }
</style>

<script>
(function() {
  const widget = document.getElementById('chatbot-widget');
  const toggle = document.getElementById('chatbot-toggle');
  const panel = document.getElementById('chatbot-panel');
  const closeBtn = document.getElementById('chatbot-close');
  const messagesEl = document.getElementById('chatbot-messages');
  const input = document.getElementById('chatbot-input');
  const sendBtn = document.getElementById('chatbot-send');

  function getUserInitials() {
    var raw = (widget && widget.getAttribute('data-user-display')) || '';
    var s = String(raw).trim();
    if (!s) return '?';
    var parts = s.split(/\s+/).filter(Boolean);
    if (parts.length >= 2) {
      return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
    }
    return s.length >= 2 ? s.slice(0, 2).toUpperCase() : s.charAt(0).toUpperCase();
  }

  var botIconSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 18h4"/><path d="M14 18h4"/></svg>';

  function openPanel() {
    panel.hidden = false;
    input.focus();
  }
  function closePanel() {
    panel.hidden = true;
  }

  toggle.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);

  function resizeInput() {
    input.style.height = 'auto';
    var h = Math.min(input.scrollHeight, 120);
    input.style.height = h + 'px';
  }
  input.addEventListener('input', resizeInput);
  input.addEventListener('focus', resizeInput);

  function addMessage(text, isUser, sources) {
    var row = document.createElement('div');
    row.className = 'chatbot-msg-row ' + (isUser ? 'user-row' : 'bot-row');

    var avatar = document.createElement('div');
    avatar.className = 'chatbot-avatar';
    if (isUser) {
      avatar.textContent = getUserInitials();
    } else {
      avatar.innerHTML = botIconSvg;
    }

    var bubble = document.createElement('div');
    bubble.className = 'chatbot-bubble';
    if (isUser) {
      bubble.textContent = text;
    } else {
      bubble.appendChild(document.createTextNode(text));
      if (sources && sources.length > 0) {
        var srcEl = document.createElement('div');
        srcEl.className = 'chatbot-sources';
        sources.forEach(function(name) {
          var s = document.createElement('span');
          s.textContent = 'Source: ' + name;
          srcEl.appendChild(s);
        });
        bubble.appendChild(srcEl);
      }
    }

    if (isUser) {
      row.appendChild(bubble);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(bubble);
    }
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function sendMessage() {
    var text = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    resizeInput();
    addMessage(text, true);
    sendBtn.disabled = true;

    fetch('/chatbot/api/chat/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie('csrftoken')
      },
      body: JSON.stringify({ message: text })
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var reply = data.reply || data.answer || 'No response.';
        var sources = data.sources || [];
        addMessage(reply, false, sources);
      })
      .catch(function() {
        addMessage('Could not reach the server. Please try again.', false);
      })
      .finally(function() {
        sendBtn.disabled = false;
      });
  }

  function getCookie(name) {
    var v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
    return v ? v[2] : '';
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
})();
</script>
