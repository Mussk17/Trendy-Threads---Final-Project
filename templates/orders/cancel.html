{% extends 'base.html' %}
{% block title %}Payment cancelled – Trendy Threads{% endblock %}

{% block extra_css %}
<style>
  .order-cancel-page { max-width: 560px; margin: 0 auto; text-align: center; padding: 3rem 0; }
  .order-cancel-page .page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
  .order-cancel-page .btn-continue {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: #166534;
    color: #fff !important;
    font-weight: 600;
    border-radius: var(--radius);
    text-decoration: none;
    margin-right: 1rem;
    transition: background 0.2s ease;
  }
  .order-cancel-page .btn-continue:hover { background: #15803d; color: #fff !important; }
</style>
{% endblock %}

{% block content %}
<div class="order-cancel-page">
  <h1 class="page-title">Payment cancelled</h1>
  <p class="text-muted mb-4">Your payment was not completed. No charges were made.</p>
  <a href="{% url 'cart:cart_detail' %}" class="btn-continue">Back to cart</a>
  <a href="{% url 'products:product_list' %}">Continue shopping</a>
</div>
{% endblock %}
